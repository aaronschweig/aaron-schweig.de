<!-- Aaron Schweig emblem (compass + jet), square favicon crop.
     Emblem bounds in source ~ x:509..892, y:163..461. Centered on a
     512x512 canvas.

     The plate + jet adapt to the visitor's OS light/dark preference via an
     embedded prefers-color-scheme media query (JS-free). Modern browsers
     honor media queries inside SVG favicons; older ones fall back to the
     default (dark) values in the base rules. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="compassGrad" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#929496"/><stop offset="1" stop-color="#D0D1D3"/>
    </linearGradient>
    <style>
      /* Defaults = DARK theme (anthracite plate, lightened electric jet). */
      .plate { fill: #12151c; }
      .jet { fill: #6aa9e0; }
      @media (prefers-color-scheme: light) {
        /* LIGHT theme: soft off-white plate, brand-navy jet for contrast. */
        .plate { fill: #f4f6fa; }
        .jet { fill: #0a436e; }
      }
    </style>
  </defs>
  <rect class="plate" width="512" height="512" rx="96"/>
